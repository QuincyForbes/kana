name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Romaji checker tests
        run: node tools/test-romaji.mjs
      - name: Number converter + SRS tests
        run: node tools/test-trainer.mjs
      - name: Quiz session engine tests
        run: node tools/test-session.mjs
      - name: Content checks (readings, audio, teaching material)
        run: node tools/test-content.mjs
      - name: Cache-bust versions consistent across pages
        run: |
          v=$(grep -o '?v=[0-9]*' guide.html | sort -u)
          for f in index.html trainer.html mnemonics.html 404.html; do
            fv=$(grep -o '?v=[0-9]*' "$f" | sort -u)
            if [ "$v" != "$fv" ]; then
              echo "version mismatch: guide.html has $v but $f has $fv"; exit 1
            fi
          done
          sw="?v=$(grep -o 'const VERSION = [0-9]*' sw.js | grep -o '[0-9]*$')"
          if [ "$v" != "$sw" ]; then
            echo "version mismatch: pages are at $v but sw.js VERSION is $sw"; exit 1
          fi
          echo "all pages and sw.js at $v"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Playwright is installed for this job only — the site itself has no dependencies
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: node tools/smoke.mjs
